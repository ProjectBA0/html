<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생성자 함수 만들기</title>
</head>
<body>
    <script>
        function Musical(seat,person,ticketvalue){
            this.seat =seat;
            this.person = person;
            this.ticketvalue = ticketvalue;

        }
        Musical.prototype.musicalticket = function(){
                document.write('<br>뮤지컬 삼총사의 '+this.seat+'석 티켓'+this.person+"장의 가격은"+this.ticketvalue*this.person+"원 입니다.");
            }


        //인스턴스 (객체)
        const todaymusical= new Musical('VIP',5,130000);
        todaymusical.musicalticket()

        const rmusical = new Musical('R',2,30000);
        rmusical.musicalticket()

        const smusical = new Musical('s',1,100000);
        smusical.musicalticket()
        

    </script>
</body>
</html>
